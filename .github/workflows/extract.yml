name: Grab Accessibility Inspector
on: workflow_dispatch
jobs:
  extract:
    runs-on: macos-latest
    steps:
      - name: Bundle Accessibility Inspector with Required Frameworks
        run: |
          XCODE_CONTENTS=$(dirname "$(xcode-select -p)")
          echo "Using Xcode at: $XCODE_CONTENTS"
          mkdir -p bundle/Applications bundle/SharedFrameworks bundle/Frameworks
          cp -R "$XCODE_CONTENTS/Applications/Accessibility Inspector.app" bundle/Applications/

          python3 - "$XCODE_CONTENTS" << 'EOF'
          import os, subprocess, shutil, sys

          xcode = sys.argv[1]
          search_dirs = [
              os.path.join(xcode, "SharedFrameworks"),
              os.path.join(xcode, "Frameworks"),
          ]
          queue = ["bundle/Applications/Accessibility Inspector.app/Contents/MacOS/Accessibility Inspector"]
          seen = set()

          while queue:
              bin_path = queue.pop(0)
              if bin_path in seen or not os.path.exists(bin_path):
                  continue
              seen.add(bin_path)
              out = subprocess.check_output(["otool", "-L", bin_path], text=True)
              for line in out.splitlines()[1:]:
                  dep = line.strip().split(" ")[0]
                  if dep.startswith("@rpath/"):
                      rel = dep[len("@rpath/"):]
                      fw_name = rel.split("/")[0]
                      for sdir in search_dirs:
                          src = os.path.join(sdir, fw_name)
                          if os.path.exists(src):
                              dst_dir = os.path.join("bundle", os.path.basename(sdir))
                              dst = os.path.join(dst_dir, fw_name)
                              if not os.path.exists(dst):
                                  if os.path.isdir(src):
                                      shutil.copytree(src, dst, symlinks=True)
                                  else:
                                      shutil.copy2(src, dst)
                              queue.append(os.path.join(dst_dir, rel))
                              break
          EOF

          ditto -c -k --sequesterRsrc --keepParent bundle "AccessibilityInspectorBundle.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccessibilityInspectorBundle
          path: AccessibilityInspectorBundle.zip
